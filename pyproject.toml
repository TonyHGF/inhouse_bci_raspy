[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-raspy-experiments"
version = "0.1.0"
description = "Independent EEGNet and multi-window ablation framework"
requires-python = ">=3.10"
dependencies = ["numpy==2.0.2", "scipy==1.13.1", "mne==1.8.0", "matplotlib==3.9.4", "scikit-learn==1.6.1", "python-picard==0.8.2", "torch>=2.5,<3.0", "h5py>=3.11,<4"]

[project.scripts]
bci-raspy-experiments = "bci_raspy_experiments.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bci_raspy_experiments*"]

[tool.setuptools.package-data]
bci_raspy_experiments = ["profiles/*.json", "vendor/PROVENANCE.json", "README.md"]
